[project]
name = "second-brain"
version = "0.1.0.dev0"
description = "AI Second Brain 6.0: cloud-hosted personal knowledge service for Claude Code"
requires-python = ">=3.12"
authors = [{ name = "Mohammed Alsaleh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]
"tests/*" = ["E501"]
