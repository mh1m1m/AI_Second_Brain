name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest --cov
      - run: python tools/backlog.py validate
      - run: python tools/backlog.py render --check
  issue-drift:
    # Fails when a mirrored issue was edited on GitHub or a backlog change was not pushed to the mirror (decision PD-009).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/github_mirror.py "$GITHUB_REPOSITORY" --check
        env:
          GH_TOKEN: ${{ github.token }}
# No deployment job: commit, push, merge, release and deploy are separate, separately authorised actions.
