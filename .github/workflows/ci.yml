name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python tools/backlog.py validate
      - run: python tools/backlog.py render --check
# No deployment job: commit, push, merge, release and deploy are separate, separately authorised actions.
